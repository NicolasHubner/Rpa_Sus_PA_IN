version: '3.9'

services:
  backend:
    build:
      context: ./backEnd
    ports:
      - "8000:8000"
    volumes:
      - shared-data:/app
    networks:
      - app-network

  frontend:
    build:
      context: ./frontEnd
    ports:
      - "3000:3000"
    volumes:
      - shared-data:/app
    networks:
      - app-network

volumes:
  shared-data:
    driver:local

networks:
  app-network:
